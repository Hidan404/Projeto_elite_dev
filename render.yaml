services:
  - type: web
    name: cineelite-api
    runtime: docker
    repo: https://github.com/Hidan404/Projeto_elite_dev
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://cineelite.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
